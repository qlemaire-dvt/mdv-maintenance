<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Maintenance — La Maison du Vivant</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: #0d1f10;
  font-family: 'Cormorant Garamond', Georgia, serif;
  color: #a8c8b2;
  display: flex; align-items: center; justify-content: center;
}
.page {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%; height: 100%;
  padding: 24px;
  gap: 0;
}
.image-wrap {
  width: 100%;
  max-width: 860px;
  border-radius: 12px 12px 0 0;
  overflow: hidden;
  box-shadow: 0 -4px 60px #00000088, 0 0 0 1px #3d7a5222;
  animation: risein 1.4s cubic-bezier(0.16,1,0.3,1) both;
  flex-shrink: 0;
  max-height: 62vh;
}
.image-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
  display: block;
}
.card {
  width: 100%;
  max-width: 860px;
  background: linear-gradient(135deg, #0a1a0fff, #0f2a1aff, #081408ff);
  border: 1px solid #3d7a5244;
  border-top: none;
  border-radius: 0 0 12px 12px;
  padding: 28px 48px 32px;
  text-align: center;
  box-shadow: 0 24px 80px #000000cc;
  animation: risein 1.4s 0.1s cubic-bezier(0.16,1,0.3,1) both;
}
@keyframes risein {
  from { opacity: 0; transform: translateY(30px); }
  to   { opacity: 1; transform: translateY(0); }
}
.eyebrow {
  font-size: 0.68rem;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: #3d7a52;
  margin-bottom: 10px;
}
.body-text {
  font-size: 1.05rem;
  font-weight: 300;
  line-height: 1.7;
  color: #6aaa82;
}
.sub {
  margin-top: 16px;
  font-size: 0.78rem;
  letter-spacing: 0.15em;
  color: #3d7a52;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.dots span {
  display: inline-block;
  width: 4px; height: 4px;
  background: #3d7a52;
  border-radius: 50%;
  animation: dotpulse 1.5s ease-in-out infinite;
  margin: 0 2px;
}
.dots span:nth-child(2) { animation-delay: 0.3s; }
.dots span:nth-child(3) { animation-delay: 0.6s; }
@keyframes dotpulse {
  0%, 100% { opacity: 0.2; transform: scale(0.7); }
  50%       { opacity: 1;   transform: scale(1.3); }
}
</style>
</head>
